  extends:
    - .linux_dgx_spark_runner
    - .test_archive
  needs:
    - build_archive:linux:arm64:cuda13


# Test that you can run dorado on a CUDA-less windows machine
test_archive:windows:cpu:
  extends:
    - .test_archive
  tags:
    - windows-11
    - no-gpu
  needs:
    - build_archive:windows:cuda12

# Test that models can be downloaded and run.
test:model_download:linux:x86:noble:
  image: ${DORADO_DOCKER_ROOT}/dorado-24.04-cuda-${CUDA}.0:1.1
  variables:
    ONT_PYTHON_URL: ${ONT_PYTHON_URL_PREFIX}/${ONT_PYTHON_FILENAME_LINUX_X86_313}
  extends:
    - .linux_test_dependencies
    - .linux_runner
    - .on_nightly_or_manual
  stage: test
  needs:
    - build:linux:x86:noble
  script:
    - ./tests/test_model_download.py --exe ./dist/bin/dorado --data ./tests/data --batchsize 64

test:model_download:macos:arm:
  extends:
    - .macos_arm_runner
    - .on_nightly_or_manual
  stage: test
  needs:
    - build:macos:arm
  script:
    - ./tests/test_model_download.py --exe ./dist/bin/dorado --data ./tests/data
  timeout: 3h
