include:
  - local: .gitlab/sanitizers-ci.yml
  - local: .gitlab/build-ont_core.yml
  - local: .gitlab/regression_tests.yml
  - local: .gitlab/mlhub.yml
  - local: .gitlab/pages.yml

workflow:
  rules:
    # If a new commit is pushed to the branch but an MR is already opened, don't run a "push" pipeline because
    # the merge request train setting will trigger a "merge_request_event" pipeline anyway.
    # In all other cases, run the pipeline.
    - if: $CI_PIPELINE_SOURCE == 'push' && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_PIPELINE_SOURCE == 'schedule'
    - if: $CI_PIPELINE_SOURCE == 'push'
    - if: $CI_PIPELINE_SOURCE == 'web'

default:
  interruptible: true

stages:
  - pre-flight
  - build
  - test
  - deploy
  - regression_test
  - rebase
  - notify

variables:
  # Build and test variables
  BUILD_DIR: build
  BUILD_TARGET: install
  BUILD_TYPE: Release
  GIT_SUBMODULE_STRATEGY: recursive
  ONT_PYTHON_FILENAME_LINUX_X86_313: ont-python-Linux-x86_64-3.13.7-1.tar.gz
  ONT_PYTHON_FILENAME_LINUX_ARM64_313: ont-python-Linux-aarch64-3.13.7-1.tar.gz
  PYTHON_VERSION: "python3.13"
  CUDA: "12.8"
  WIN_CUDA_TOOLKIT: "/c/Program Files/NVIDIA GPU Computing Toolkit/CUDA/v${CUDA}"
  WIN_CMAKE_GENERATOR: "\"Visual Studio 17 2022\""
  MTL_DEBUG_LAYER: 1

  # Gitlab runner variables
  FF_TIMESTAMPS: true
  FF_USE_FASTZIP: true
  TRANSFER_METER_FREQUENCY: 5s

# Build stage components

.macos_arm_runner:
  tags:
    - osx_arm64
    - xcode-15.3
    - on-prem
  variables:
    MACOSX_DEPLOYMENT_TARGET: "14.0"

.linux_runner:
  tags:
    - ubuntu-20.04
    - nvidia-docker
    - on-prem

.linux_arm64_runner:
  tags:
    - linux
    - prod
    - arm64
    - eks
    - 2xlarge
    - standard

.linux_orin_cuda_12_runner:
  tags:
    - linux-arm64-gpu-12.6
    - nvidia-docker
    - on-prem

.linux_thor_runner:
  tags:
    - linux-arm64-gpu-thor
    - nvidia-docker
    - on-prem

.linux_dgx_spark_runner:
  tags:
    - linux-arm64-gpu-spark
    - nvidia-docker
    - on-prem

.windows_runner:
  tags:
    - windows
    - VS2022
    - cuda-${CUDA}
    - on-prem

.linux_build_dependencies:
  before_script:
    - echo Dorado dependency stage
    - apt-get update
    - apt-get install -y --no-install-recommends samtools curl libsz2 ccache automake

.linux_test_dependencies:
  before_script:
    - echo Dorado dependency stage
    - apt-get update
    - apt-get install -y --no-install-recommends samtools curl tabix

.set_parallel_jobs:
  - |
    if [[ $OSTYPE == 'darwin'* ]]; then
      PARALLEL_JOBS=$(( $(sysctl -n hw.physicalcpu) / 2 ))
    elif [[ $(arch) != 'aarch64' ]]; then
      PARALLEL_JOBS=$(( $(nproc) / 4 ))
    else
      PARALLEL_JOBS=8
    fi
    PARALLEL_JOBS=$(( 8 > PARALLEL_JOBS ? 8 : PARALLEL_JOBS ))
  - echo "PARALLEL_JOBS '${PARALLEL_JOBS}'"

.setup_ccache:
  - if [[ -d '/data/gitlab-ci-cache' ]] && [[ $OSTYPE != 'darwin'* ]] && [[ $OSTYPE != 'msys' ]]; then
  -   export CCACHE_DIR=/data/gitlab-ci-cache
  - fi
  - ccache -s || true

.run_dorado_cmake_build:
  - echo Dorado build stage
  - !reference [.set_parallel_jobs]
  - !reference [.setup_ccache]
  - echo "BUILD_OPTIONS '${BUILD_OPTIONS}'"
  - eval cmake ${BUILD_OPTIONS} -S . -B ${BUILD_DIR} -D CMAKE_BUILD_TYPE=${BUILD_TYPE} -D DORADO_ENABLE_BENCHMARK_TESTS=ON -DDORADO_3RD_PARTY_DOWNLOAD=dorado-dependencies
  - cmake --build ${BUILD_DIR} --config ${BUILD_TYPE} --target ${BUILD_TARGET} -j ${PARALLEL_JOBS}

.run_dorado_cmake_ctest:
  - echo Dorado test stage
  - ctest -C ${BUILD_TYPE} --test-dir ${BUILD_DIR} --output-on-failure --verbose

.create_venv:
  # Determine where we're getting python from.
  - if [[ -n ${ONT_PYTHON_URL} ]]; then
  -   curl -LfsS ${ONT_PYTHON_URL} > ont_python.tar.gz
  -   tar -xf ont_python.tar.gz
  -   PYTHON=${PWD}/ont-python/bin/python3
  - elif [[ ${OSTYPE} == "msys" ]]; then
  -   /c/${PYTHON_VERSION//./}/python --version
  -   export PATH="/c/${PYTHON_VERSION//./}/":${PATH}
  -   PYTHON=python
  - else
  -   PYTHON=${PYTHON_VERSION}
  - fi
  # Make a venv and install stuff we need.
  - ${PYTHON} -m venv build_venv
  - source build_venv/*/activate
  - python --version
  - export PYTHON=python
  - python -m pip install -U pip
  # cmake 3.31 has issues with macOS 13.6.6/curl 8.4.0 (see INSTX-7966)
  - pip install -U "cmake<3.31"
  - cmake --version

.run_tetra_tests:
  # pysam is not available on all platforms, but the tests can run without it.
  - echo Running tetra unit tests
  - pip install pysam "--only-binary=:all:" || true
  # Note we use --prefer-binary to avoid issues with h5py 3.15, see DOR-1410
  - pip install --prefer-binary -e tetra
  - cd tetra
  - python -m unittest discover
  - cd -

.run_dorado_cmake_cpack:
  - echo Dorado packaging stage
  - cpack --config ${BUILD_DIR}/CPackConfig.cmake

.zip_test_files:
  # Uploading these allows us to avoid checking out the repo in tests.
  - echo Zipping test files
  - |
    zip -r  tests.archive tests/*.sh tests/*.py tests/data tests/cram ||
    tar -cf tests.archive tests/*.sh tests/*.py tests/data tests/cram

.unzip_test_files:
  - echo Unzipping test files
  - unzip tests.archive || tar -xf tests.archive

.build_and_test_dorado:
  stage: build
  script:
    - !reference [.create_venv]
    - !reference [.run_dorado_cmake_build]
    - !reference [.run_dorado_cmake_ctest]
    - !reference [.zip_test_files]
    - !reference [.run_tetra_tests]
  artifacts:
    paths:
      - dist
      - tests.archive
    expire_in: 1 day
  cache:
    key: dorado-dependencies-$CI_JOB_NAME_SLUG
    paths:
      - dorado-dependencies

.build_dorado_archive:
  stage: build
  variables:
    # All of the archive jobs produce an archive, so there's no point
    # in trying to compress it further.
    ARTIFACT_COMPRESSION_LEVEL: "fastest"
  script:
    - !reference [.create_venv]
    - !reference [.run_dorado_cmake_build]
    - !reference [.run_dorado_cmake_cpack]
  artifacts:
    paths:
      - archive
    expire_in: 1 day
  cache:
    key: dorado-dependencies-$CI_JOB_NAME_SLUG
    paths:
      - dorado-dependencies

.sign_dorado:macos:
  script:
    # Older versions of macOS (10.15) can't run notarytool through xcrun, but can make
    # use of the standalone notarytool executable if it's copied from a newer system.
    # See https://developer.apple.com/forums/thread/712665.
    - |
      if command -v notarytool > /dev/null; then
        NOTARYTOOL=(notarytool)
      else
        NOTARYTOOL=(xcrun notarytool)
      fi
    # We sign the executable as part of CPack's packaging steps, so the package that it
    # produces should be ready to be notarized. That can be done asynchronously, but
    # doing everything in one pass (--wait flag) saves complicating the jobs.
    - ${NOTARYTOOL[@]} submit archive/dorado-*.zip
      --apple-id ${APPLE_NOTARIZATION_ID}
      --password ${APPLE_NOTARIZATION_PASSWORD}
      --team-id ${APPLE_NOTARIZATION_TEAM}
      --progress --verbose --wait
    # If notarization fails you need to run `xcrun notarytool log <request id>` to get
    # information about what failed.
    #
    # Extract the binary and check that it's notarized, since notarytool doesn't appear
    # to return an error on failure.
    - rm -rf notarization_check
    - unzip archive/dorado-*.zip -d notarization_check
    - spctl -a -t install -vvvv notarization_check/dorado-*/bin/dorado
    #
    # No stapling for now since you can only staple packages and not executables, hence
    # we'd need to switch to a dmg instead and do something like:
    #- xcrun stapler staple dorado-*.dmg

# Run this job manually, but always run on nightly.
.on_nightly_or_manual:
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE != "schedule"
      when: manual
      # See https://forum.gitlab.com/t/specifying-a-pipeline-step-as-manual-causes-its-status-to-always-be-blocked/58333/3
      allow_failure: true

# Pre-flight stages

pre-commit:
  image: ${DORADO_PRECOMMIT}
  variables:
    GIT_SUBMODULE_STRATEGY: none
  stage: pre-flight
  script:
    - echo "Pipeline source is ${CI_PIPELINE_SOURCE}"
    - pip install pre-commit
    - pre-commit run --all-files
  tags:
    - linux
    - prod
    - amd64
    - eks
    - docker
    - small

# Build stages

build:linux:x86:noble_koi_from_source:
  image: ${DORADO_DOCKER_ROOT}/dorado-24.04-cuda-${CUDA}.0:1.1
  variables:
    BUILD_OPTIONS: "-DKOI_DIR=koi -DGITLAB_CI_TOKEN=${CI_JOB_TOKEN} -DONT_MM2_EXE=ON"
    ONT_PYTHON_URL: ${ONT_PYTHON_URL_PREFIX}/${ONT_PYTHON_FILENAME_LINUX_X86_313}
  extends:
    - .linux_build_dependencies
    - .linux_runner
    - .build_and_test_dorado
    - .on_nightly_or_manual
  artifacts: null

build:linux:x86:noble:
  image: ${DORADO_DOCKER_ROOT}/dorado-24.04-cuda-${CUDA}.0:1.1
  variables:
    BUILD_OPTIONS: "-DONT_MM2_EXE=ON"
    ONT_PYTHON_URL: ${ONT_PYTHON_URL_PREFIX}/${ONT_PYTHON_FILENAME_LINUX_X86_313}
  extends:
    - .linux_build_dependencies
    - .linux_runner
    - .build_and_test_dorado
  before_script:
    - !reference [.linux_build_dependencies, before_script]
    - apt-get install -y build-essential

build:linux:x86:noble:debug:
  variables:
    BUILD_TYPE: "Debug"
  extends:
    - build:linux:x86:noble
  rules:
    - if: $CI_MERGE_REQUEST_EVENT_TYPE == "merged_result"
  artifacts: null

build:linux:x86:coverage:
  stage: build
  image: ${DORADO_DOCKER_ROOT}/dorado-24.04-cuda-${CUDA}.0:1.1
  variables:
    BUILD_OPTIONS: "-DGENERATE_TEST_COVERAGE=1"
    BUILD_TARGET: "dorado_test_coverage"
    BUILD_TYPE: "Debug"
    ONT_PYTHON_URL: ${ONT_PYTHON_URL_PREFIX}/${ONT_PYTHON_FILENAME_LINUX_X86_313}
  extends:
    - .linux_build_dependencies
    - .linux_runner
    - .on_nightly_or_manual
  script:
    - !reference [.create_venv]
    - pip install gcovr
    - !reference [.run_dorado_cmake_build]
  rules:
    - if: $CI_MERGE_REQUEST_EVENT_TYPE == "merged_result"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - !reference [.on_nightly_or_manual, rules]
  coverage: '/lines: \d+(?:\.\d+)?/'
  artifacts:
    paths:
      - build/dorado_test_coverage.xml
      - build/dorado_test_coverage/
    reports:
      coverage_report:
        coverage_format: cobertura
        path: build/dorado_test_coverage.xml
  cache:
    key: dorado-dependencies-$CI_JOB_NAME_SLUG
    paths:
      - dorado-dependencies

build:linux:x86:clang_tidy:
  stage: build
  image: ${DORADO_DOCKER_ROOT}/dorado-24.04-cuda-${CUDA}.0:1.1
  variables:
    ONT_PYTHON_URL: ${ONT_PYTHON_URL_PREFIX}/${ONT_PYTHON_FILENAME_LINUX_X86_313}
  extends:
    - .linux_build_dependencies
    - .linux_runner
  script:
    - apt update
    - apt install -y automake clang clang-tidy
    - !reference [.set_parallel_jobs]
    - ./.gitlab/run_clang_tidy.sh -j ${PARALLEL_JOBS} -c dorado-dependencies -t dorado
  artifacts: null
  cache:
    key: dorado-dependencies-$CI_JOB_NAME_SLUG
    paths:
      - dorado-dependencies

.build:linux:x86:valgrind:
  stage: build
  image: ${DORADO_DOCKER_ROOT}/dorado-24.04-cuda-${CUDA}.0:1.1
  variables:
    # valgrind can't cope with huge executables, so we have to go dynamic.
    BUILD_OPTIONS: "-D TRY_USING_STATIC_TORCH_LIB=NO"
    ONT_PYTHON_URL: ${ONT_PYTHON_URL_PREFIX}/${ONT_PYTHON_FILENAME_LINUX_X86_313}
  extends:
    - .linux_runner
  script:
    - !reference [.create_venv]
    - !reference [.set_parallel_jobs]
    - apt update
    - apt install -y autoconf autotools-dev automake wget libc6-dbg
    # We need a recent valgrind that includes https://bugs.kde.org/show_bug.cgi?id=402833.
    - VALGRIND_VERSION="3.22.0"
    - wget https://sourceware.org/pub/valgrind/valgrind-${VALGRIND_VERSION}.tar.bz2
    - tar -xvf valgrind-${VALGRIND_VERSION}.tar.bz2
    - pushd valgrind-${VALGRIND_VERSION}
    - ./autogen.sh
    - ./configure
    - make -j ${PARALLEL_JOBS}
    - valgrind=$(pwd)/vg-in-place
    - popd
    # We need symbols otherwise the generated reports are useless.
    - export CFLAGS="${CFLAGS} -g"
    - export CXXFLAGS="${CXXFLAGS} -g"
    # Build dorado.
    - !reference [.run_dorado_cmake_build]
    # Run the ordinary tests directly under valgrind.
    # We don't use `ctest -VV -E smoke -T memcheck` since that requires additional setup.
    - ${valgrind} --error-exitcode=1 --track-origins=yes -- ./${BUILD_DIR}/tests/dorado_tests
  cache:
    key: dorado-dependencies-$CI_JOB_NAME_SLUG
    paths:
      - dorado-dependencies

build:linux:arm64:jammy:
  image: ${DORADO_DOCKER_ROOT}/dorado-l4t-r36.4.0:1.0
  variables:
    BUILD_OPTIONS: "-DONT_MM2_EXE=ON"
    ONT_PYTHON_URL: ${ONT_PYTHON_URL_PREFIX}/${ONT_PYTHON_FILENAME_LINUX_ARM64_313}
  extends:
    - .linux_build_dependencies
    - .linux_arm64_runner
    - .build_and_test_dorado

build:linux:arm64:cuda13:
  image: ${DORADO_DOCKER_ROOT}/dorado-24.04-arm64-cuda-13.0.0:1.0
  variables:
    BUILD_OPTIONS: "-DONT_MM2_EXE=ON"
    ONT_PYTHON_URL: ${ONT_PYTHON_URL_PREFIX}/${ONT_PYTHON_FILENAME_LINUX_ARM64_313}
  extends:
    - .linux_build_dependencies
    - .linux_arm64_runner
    - .build_and_test_dorado

build:linux:x86:noble:no_ccache:
  variables:
    BUILD_OPTIONS: "-D DORADO_DISABLE_CCACHE=ON"
    ONT_PYTHON_URL: ${ONT_PYTHON_URL_PREFIX}/${ONT_PYTHON_FILENAME_LINUX_X86_313}
  extends:
    - build:linux:x86:noble
    - .on_nightly_or_manual
  artifacts: null

build:windows:
  variables:
    # Disable fastzip on windows since it causes the slower runners to timeout
    # when uploading artifacts.
    FF_USE_FASTZIP: false
  extends:
    - .windows_runner
    - .build_and_test_dorado
  before_script:
    - export CUDA_TOOLKIT=$(cygpath -u $(cygpath -d "${WIN_CUDA_TOOLKIT}"))
    - export BUILD_OPTIONS="-A x64 -T cuda=${CUDA} -DCUDAToolkit_ROOT=${CUDA_TOOLKIT} -D WIN_THREADS=4 -G ${WIN_CMAKE_GENERATOR}"

build:windows:debug:
  variables:
    BUILD_TYPE: "Debug"
  extends:
    - build:windows
  rules:
    - if: $CI_MERGE_REQUEST_EVENT_TYPE == "merged_result"
  artifacts: null

build:windows_koi_from_source:
  extends:
    - build:windows
    - .on_nightly_or_manual
  before_script:
    - !reference ["build:windows", before_script]
    - export BUILD_OPTIONS="${BUILD_OPTIONS} -DKOI_DIR=koi -DGITLAB_CI_TOKEN=${CI_JOB_TOKEN} -G ${WIN_CMAKE_GENERATOR}"
  artifacts: null
  timeout: 1h 30m

build:windows:no_ccache:
  extends:
    - build:windows
    - .on_nightly_or_manual
  before_script:
    - !reference ["build:windows", before_script]
    - export BUILD_OPTIONS="${BUILD_OPTIONS} -D DORADO_DISABLE_CCACHE=ON -G \"Visual Studio 17 2022\""
  artifacts: null

build:macos:arm:
  variables:
    BUILD_OPTIONS: "-DONT_MM2_EXE=ON"
  extends:
    - .macos_arm_runner
    - .build_and_test_dorado

build:macos:arm:no_ccache:
  variables:
    BUILD_OPTIONS: "-D DORADO_DISABLE_CCACHE=ON"
  extends:
    - build:macos:arm
    - .on_nightly_or_manual
  artifacts: null

build_archive:linux:arm64:jammy:
  image: ${DORADO_DOCKER_ROOT}/dorado-l4t-r36.4.0:1.0
  variables:
    ONT_PYTHON_URL: ${ONT_PYTHON_URL_PREFIX}/${ONT_PYTHON_FILENAME_LINUX_ARM64_313}
  extends:
    - .linux_build_dependencies
    - .linux_arm64_runner
    - .build_dorado_archive
    - .on_nightly_or_manual

build_archive:linux:arm64:cuda13:
  image: ${DORADO_DOCKER_ROOT}/dorado-24.04-arm64-cuda-13.0.0:1.0
  variables:
    ONT_PYTHON_URL: ${ONT_PYTHON_URL_PREFIX}/${ONT_PYTHON_FILENAME_LINUX_ARM64_313}
  extends:
    - .linux_build_dependencies
    - .linux_arm64_runner
    - .build_dorado_archive
    - .on_nightly_or_manual

.build_archive:linux:x86:
  image: ${DORADO_DOCKER_ROOT}/dorado-rocky8-cuda-${CUDA}.0:1.1
  variables:
    ONT_PYTHON_URL: ${ONT_PYTHON_URL_PREFIX}/${ONT_PYTHON_FILENAME_LINUX_X86_313}
  script:
    - source /opt/rh/gcc-toolset-11/enable
    - !reference [.build_dorado_archive, script]
  extends:
    - .linux_runner
    - .build_dorado_archive
    - .on_nightly_or_manual

build_archive:linux:x86:cuda12:
  extends:
    - .build_archive:linux:x86

build_archive:linux:x86:cuda13:
  variables:
    CUDA: "13.0"
  extends:
    - .build_archive:linux:x86

.build_archive:windows:
  before_script:
    - export CUDA_TOOLKIT=$(cygpath -u $(cygpath -d "${WIN_CUDA_TOOLKIT}"))
    - export BUILD_OPTIONS="-A x64 -T cuda=${CUDA} -DCUDAToolkit_ROOT=${CUDA_TOOLKIT} -D WIN_THREADS=4 -G ${WIN_CMAKE_GENERATOR}"
  extends:
    - .windows_runner
    - .build_dorado_archive
    - .on_nightly_or_manual

build_archive:windows:cuda12:
  extends:
    - .build_archive:windows

build_archive:windows:cuda13:
  variables:
    CUDA: "13.0"
  extends:
    - .build_archive:windows

build_archive:macos:arm:
  extends:
    - .macos_arm_runner
    - .build_dorado_archive
    - .on_nightly_or_manual
  script:
    - !reference [.build_dorado_archive, script]
    - !reference [.sign_dorado:macos, script]

# Test stage components

.test_dorado_common:
  stage: test
  variables:
    GIT_STRATEGY: none
    MODEL: dna_r10.4.1_e8.2_400bps_hac@v6.0.0
    BATCH: 384
    VALIDATE_FASTQ: 1
    VALIDATE_BAM: 1
  script:
    - !reference [.create_venv]
    # Do everything inside a newly created folder, since some runners only run
    # tests and hence never perform a git clean.
    - rm -rf test_archive
    - mkdir test_archive
    - cd test_archive
    - mv ../dist ../tests.archive .
    - !reference [.unzip_test_files]
    # Manually sharding the tests based on how long they take (in an arm64 job).
    # Note that Windows can't run the cram tests (shard 1 and 2).
    - if [[ ${TEST_SHARD} -eq 0 ]] ; then
    -   bash ./tests/test_simple_basecaller_execution.sh ./dist/bin/dorado ${MODEL} ${BATCH}  # 11m
    -   bash ./tests/test_nested_output_structure.sh ./dist/bin/dorado ${MODEL} ${BATCH}      # <1m
    -   bash ./tests/test_expected_logging.sh ./dist/bin/dorado ${MODEL} ${BATCH}             # <1m
    -   bash ./tests/test_model_resolution.sh ./dist/bin/dorado                               # <1m
    -   bash ./tests/test_dorado_correct.sh ./dist/bin/dorado                                 # <1m
    - elif [[ ${TEST_SHARD} -eq 1 ]] ; then
    -   bash ./tests/test_dorado_correct_cram.sh ./dist/bin/dorado                            # 10m
    -   bash ./tests/test_dorado_variant.sh ./dist/bin/dorado                                 # 3m
    - elif [[ ${TEST_SHARD} -eq 2 ]] ; then
    -   bash ./tests/test_dorado_polish.sh ./dist/bin/dorado                                  # 16m
    - else
    -   echo "Invalid shard '${TEST_SHARD}'"
    -   exit 1
    - fi
  artifacts:
    when: on_failure
    paths:
      - test_archive/tests
    expire_in: 1 day

.test_dorado:
  extends:
    - .test_dorado_common
  parallel:
    matrix:
      - TEST_SHARD: [0, 1, 2]

.test_dorado_windows:
  extends:
    - .test_dorado_common
  variables:
    SAMTOOLS_UNAVAILABLE: sadly_yes
    VALIDATE_BAM: 0
  parallel:
    matrix:
      # Not running shards 1 or 2. See .test_dorado_common
      - TEST_SHARD: [0]

.extract_archive:
  script:
    - tar -xzf archive/dorado-*.gz || unzip archive/dorado-*.zip || exit 1
    # I'm making the assumption here that there's only 1 archive, that it's prefixed with dorado-, and that
    # there's no other files/dirs with the same prefix.
    - export EXTRACTED_PATH=$(ls | grep "^dorado-")
    - echo "Testing binaries in ${EXTRACTED_PATH}"

.test_archive:
  stage: test
  variables:
    GIT_STRATEGY: none
  script:
    # Do everything inside a newly created folder, since some runners only run
    # tests and hence never perform a git clean.
    - rm -rf test_archive
    - mkdir test_archive
    - cd test_archive
    - mv ../archive .
    - !reference [.extract_archive, script]
    - ldd ./dorado-*/bin/dorado
    - if [ -e ./dorado-*/lib/libdorado_torch_lib.so ]; then ldd ./dorado-*/lib/libdorado_torch_lib.so; fi
    # We just want to check that dorado will run here, so simply display the verbose version info
    - ./dorado-*/bin/dorado -vv

# Test stages

test:windows:
  extends:
    - .windows_runner
    - .test_dorado_windows
  needs:
    - build:windows

test:linux:x86:noble:
  image: ${DORADO_DOCKER_ROOT}/dorado-24.04-cuda-${CUDA}.0:1.1
  variables:
