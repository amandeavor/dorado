# MLHub - Single read eval

.mlhub_job:
  stage: test
  image: ${TRIGGER_IMAGE}
  variables:
    EKS_SIZE: small
  extends: 
    - .linux_runner    
  before_script:
    - pip install mlhub-api
  script:
    - sed -i "s#COMMIT_SHA_PLACEHOLDER#${CI_COMMIT_SHA}#g" ${SAMPLE_SHEET}
    - sed -i "s#COMMIT_SHORT_PLACEHOLDER#${CI_COMMIT_SHORT_SHA}#g" ${SAMPLE_SHEET}
    - sed -i "s#OUTPUT_PLACEHOLDER#${SRE_OUTPUT_ROOT}#g" ${SAMPLE_SHEET}
    - |
      mlh-sheet ${SAMPLE_SHEET} \
        --git_ref ${MLH_BRANCH} \
        --script_id ${SCRIPT_ID} \
        --csrf_token ${MLH_CRSF_TOKEN} \
        --session_id ${MLH_SESSION_ID}
  needs:
  - job: build:linux:x86:noble
    artifacts: false
  when: manual


mlhub:sre_dna_r1041_e82:
  extends: .mlhub_job
  variables:
    MLH_BRANCH: "dorado_regression"
    SCRIPT_ID: 378
    SAMPLE_SHEET: ".gitlab/mlhub-configs/dna-r1041-e82.tsv"

