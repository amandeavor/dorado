# Build jobs for testing ont_core compatibility

.test_ont_core_compatibility:
  stage: build
  script:
    # The ont_core build expects to be using conan, so install it
    # into a venv.
    - !reference [.create_venv]
    - pip install -U "conan"
    - conan --version
    # Merged-result MR pipelines run against a synthetic merge commit which
    # does not exist in the Dorado repo that ont_core clones. In that case
    # build against the source branch tip instead.
    - |
      if [[ "${CI_PIPELINE_SOURCE}" == "merge_request_event" ]]; then
        DORADO_FETCH_REF="${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}"
        DORADO_CHECKOUT_SHA="${CI_MERGE_REQUEST_SOURCE_BRANCH_SHA:-${CI_COMMIT_SHA}}"
      else
        DORADO_FETCH_REF="${CI_COMMIT_REF_NAME}"
        DORADO_CHECKOUT_SHA="${CI_COMMIT_SHA}"
      fi
      if [[ -z "${DORADO_FETCH_REF}" || -z "${DORADO_CHECKOUT_SHA}" ]]; then
        echo "Failed to resolve Dorado ref/SHA for ont_core compatibility build."
        exit 1
      fi
      echo "Using Dorado ref '${DORADO_FETCH_REF}' at commit '${DORADO_CHECKOUT_SHA}'"
      export DORADO_FETCH_REF
      export DORADO_CHECKOUT_SHA
    # Clone the repo
    - time git clone --depth 1 https://gitlab-ci-token:${CI_JOB_TOKEN}@${ONT_CORE_REPO_URL} ont_core_cpp
    - pushd ont_core_cpp
    -   time git submodule update --init --recursive
    -   pushd dorado
    -     time git fetch origin ${DORADO_FETCH_REF}
    -     time git checkout --detach ${DORADO_CHECKOUT_SHA}
    -     time git submodule update --init --recursive
    -   popd
    - popd
    # Do the build
    - !reference [.set_parallel_jobs]
    - !reference [.setup_ccache]
    - cmake --preset ${BUILD_PRESET} -S ont_core_cpp -B ${BUILD_DIR}
    - cmake --build ${BUILD_DIR} -j ${PARALLEL_JOBS}
    # Run the tests
    - ctest --test-dir ${BUILD_DIR} --output-on-failure --verbose

build:linux:x86:noble:ont_core:
  image: ${DORADO_DOCKER_ROOT}/dorado-24.04-cuda-${CUDA}.0:1.1
  variables:
    BUILD_PRESET: "linux-x64-conan_gcc13-dorado-release"
    ONT_PYTHON_URL: ${ONT_PYTHON_URL_PREFIX}/${ONT_PYTHON_FILENAME_LINUX_X86_313}
  extends:
    - .linux_runner
    - .test_ont_core_compatibility
    - .on_nightly_or_manual

build:macos:arm:ont_core:
  variables:
    BUILD_PRESET: "macos-aarch64-conan_appleclang15-dorado-release"
  extends:
    - .macos_arm_runner
    - .test_ont_core_compatibility
    - .on_nightly_or_manual
